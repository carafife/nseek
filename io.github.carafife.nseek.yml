app-id: io.github.carafife.nseek
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: nseek

finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --filesystem=home
  - --talk-name=org.freedesktop.portal.Desktop
  - --talk-name=org.freedesktop.portal.OpenURI
  - --env=PYTHONPATH=/app/lib/python3/dist-packages

modules:

  # ── Dépendances Python (fichiers locaux) ──────────────────────────────────

  - name: python3-webencodings
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app --no-deps webencodings-0.5.1-py2.py3-none-any.whl
    sources:
      - type: file
        path: webencodings-0.5.1-py2.py3-none-any.whl
        sha256: a0af1213f3c2226497a97e2b3aa01a7e4bee4f403f95be16fc9acd2947514a78

  - name: python3-tinycss2
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app --no-deps tinycss2-1.4.0-py3-none-any.whl
    sources:
      - type: file
        path: tinycss2-1.4.0-py3-none-any.whl
        sha256: 3a49cf47b7675da0b15d0c6e1df8df4ebd96e9394bb905a5775adb0d884c5289

  - name: python3-cssselect2
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app --no-deps cssselect2-0.8.0-py3-none-any.whl
    sources:
      - type: file
        path: cssselect2-0.8.0-py3-none-any.whl
        sha256: 46fc70ebc41ced7a32cd42d58b1884d72ade23d21e5a4eaaf022401c13f0e76e

  - name: python3-defusedxml
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app --no-deps defusedxml-0.7.1-py2.py3-none-any.whl
    sources:
      - type: file
        path: defusedxml-0.7.1-py2.py3-none-any.whl
        sha256: a352e7e428770286cc899e2542b6cdaedb2b4953ff269a210103ec58f6198a61

  - name: python3-cairocffi
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app --no-deps cairocffi-1.7.1-py3-none-any.whl
    sources:
      - type: file
        path: cairocffi-1.7.1-py3-none-any.whl
        sha256: 9803a0e11f6c962f3b0ae2ec8ba6ae45e957a146a004697a1ac1bbf16b073b3f

  - name: python3-cairosvg
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app --no-deps cairosvg-2.9.0-py3-none-any.whl
    sources:
      - type: file
        path: cairosvg-2.9.0-py3-none-any.whl
        sha256: 4b82d07d145377dffdfc19d9791bd5fb65539bb4da0adecf0bdbd9cd4ffd7c68

  - name: python3-pypdf
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app --no-deps pypdf-4.2.0-py3-none-any.whl
    sources:
      - type: file
        path: pypdf-4.2.0-py3-none-any.whl
        sha256: dc035581664e0ad717e3492acebc1a5fc23dba759e788e3d4a9fc9b1a32e72c1

  # ── Application principale ────────────────────────────────────────────────

  - name: nseek
    buildsystem: simple
    build-commands:
      - install -d /app/share/nseek/assets
      - install -d /app/share/nseek/docs
      - install -m 644 nseek.py /app/share/nseek/
      - install -m 644 make_logo.py /app/share/nseek/
      - cp -r assets/* /app/share/nseek/assets/
      - install -d /app/share/icons/hicolor/128x128/apps
      - install -d /app/share/icons/hicolor/256x256/apps
      - install -d /app/share/icons/hicolor/512x512/apps
      - install -m 644 assets/nseek-icon-128.png /app/share/icons/hicolor/128x128/apps/io.github.carafife.nseek.png
      - install -m 644 assets/nseek-icon-256.png /app/share/icons/hicolor/256x256/apps/io.github.carafife.nseek.png
      - install -m 644 assets/nseek-icon-512.png /app/share/icons/hicolor/512x512/apps/io.github.carafife.nseek.png
      - install -d /app/share/applications
      - install -m 644 io.github.carafife.nseek.desktop /app/share/applications/
      - install -d /app/share/metainfo
      - install -m 644 io.github.carafife.nseek.metainfo.xml /app/share/metainfo/
      - install -d /app/bin
      - install -m 755 nseek.sh /app/bin/nseek
    sources:
      - type: dir
        path: .
